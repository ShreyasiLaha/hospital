{% extends 'base.html' %}

{% block title %}Set New Password — CarePlus Hospital{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-8 col-lg-6 col-xl-5">
    <div class="cp-card p-4 p-md-5">
      <div class="text-center mb-4">
        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="CarePlus Hospital" height="50" class="mb-3">
        <h3 class="fw-bold text-cp-navy mb-1">Set New Password</h3>
        <p class="text-muted small">Account: <strong class="text-cp-navy">{{ email }}</strong></p>
      </div>

      <form method="POST" action="{{ url_for('auth.reset_password', token=token) }}">
        <div class="mb-3">
          <label class="form-label fw-semibold text-cp-navy small" for="new_password">New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0 py-2 fs-6" id="new_password" name="new_password" placeholder="At least 6 characters" required minlength="6">
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold text-cp-navy small" for="confirm_password">Confirm New Password</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-shield-lock"></i></span>
            <input type="password" class="form-control border-start-0 py-2 fs-6" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required minlength="6">
          </div>
        </div>

        <button type="submit" class="btn btn-cp-primary w-100 py-3 fs-6 shadow-sm mb-3">
          <i class="bi bi-check2-circle me-2"></i> Update Password & Sign In
        </button>

        <div class="text-center pt-2">
          <a href="{{ url_for('auth.login') }}" class="text-decoration-none text-muted small">
            <i class="bi bi-arrow-left me-1"></i> Cancel & Back to Sign In
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
