{% extends 'base.html' %}

{% block title %}Change Password — CarePlus Hospital{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-6 col-lg-5">
    <div class="cp-card p-4 p-md-5">
      <div class="mb-4">
        <h4 class="fw-bold">Change Password</h4>
        <p class="text-muted small">Update your account credentials to keep your profile secure.</p>
      </div>

      <form method="POST" action="{{ url_for('auth.change_password') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold" for="current_password">Current Password</label>
          <input type="password" class="form-control" id="current_password" name="current_password" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold" for="new_password">New Password</label>
          <input type="password" class="form-control" id="new_password" name="new_password" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold" for="confirm_password">Confirm New Password</label>
          <input type="password" class="form-control" id="confirm_password" name="confirm_password" required>
        </div>

        <button type="submit" class="btn btn-cp-primary w-100 py-2">
          <i class="bi bi-shield-lock-fill me-1"></i> Update Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
