{% extends 'base.html' %}

{% block title %}Change Password — CarePlus Hospital{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
  <div class="col-md-7 col-lg-5">
    <div class="cp-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="rounded-circle bg-cp-teal-light text-cp-teal d-inline-flex align-items-center justify-content-center p-3 mb-3">
          <i class="bi bi-shield-lock-fill fs-3"></i>
        </div>
        <h4 class="fw-bold text-cp-navy mb-1">Change Password</h4>
        <p class="text-muted small">Update your portal account credentials to keep your profile secure.</p>
      </div>

      <form method="POST" action="{{ url_for('auth.change_password') }}">
        <div class="mb-3">
          <label class="form-label fw-semibold text-cp-navy small" for="current_password">Current Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-white text-muted"><i class="bi bi-key"></i></span>
            <input type="password" class="form-control py-2 fs-6" id="current_password" name="current_password" placeholder="Enter current password" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold text-cp-navy small" for="new_password">New Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-white text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control py-2 fs-6" id="new_password" name="new_password" placeholder="At least 8 characters" required>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold text-cp-navy small" for="confirm_password">Confirm New Password <span class="text-danger">*</span></label>
          <div class="input-group">
            <span class="input-group-text bg-white text-muted"><i class="bi bi-shield-check"></i></span>
            <input type="password" class="form-control py-2 fs-6" id="confirm_password" name="confirm_password" placeholder="Re-enter new password" required>
          </div>
        </div>

        <button type="submit" class="btn btn-cp-primary w-100 py-3 fs-6 shadow-sm">
          <i class="bi bi-shield-lock-fill me-2"></i> Update Password
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
